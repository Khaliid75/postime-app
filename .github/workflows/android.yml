name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Construire l'interface
        run: npm run build

      - name: Créer le projet Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Ajouter les permissions de notification
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED; do
            if ! grep -q "android.permission.$P" "$MANIFEST"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
            fi
          done
          cat "$MANIFEST"

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: postime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
